<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa do que Ferir sabe — Dia 257</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#efe4cc; --papel2:#e4d5b5; --tinta:#3b2f22; --tinta2:#6b5a45; --rio:#5b86a6; --mar:#9fbccd;
    --casa:#b3412e; --liga:#7a4e9c; --cla:#3f7a4a; --neutro:#8a7a5e; --perigo:#2b2b2b; --novo:#b07a1e; --livre:#2e6f8f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#2a241c;color:var(--tinta);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:1220px;margin:0 auto;padding:18px}
  h1{font-family:"Cormorant Garamond",serif;color:#f3e7cc;font-size:30px;margin:4px 0 2px}
  .sub{color:#cbbd9f;font-size:14px;margin-bottom:10px;line-height:1.45}
  .botoes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .botoes button{font:600 13px Inter,sans-serif;border:1px solid #6b5a45;background:#3a3126;color:#efe4cc;padding:7px 12px;border-radius:99px;cursor:pointer}
  .botoes button.on{background:#efe4cc;color:#3b2f22;border-color:#efe4cc}
  .grid{display:grid;grid-template-columns:1fr 350px;gap:14px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .mapa{background:var(--papel);border-radius:10px;box-shadow:0 0 0 6px #4a3d2c inset, 0 6px 24px #0008;overflow:hidden}
  svg{display:block;width:100%;height:auto}
  .lugar{cursor:pointer}
  .lugar text{font-family:"Cormorant Garamond",serif;font-weight:700;fill:var(--tinta);font-size:17px;paint-order:stroke;stroke:var(--papel);stroke-width:4px}
  .lugar.peq text{font-size:14px}
  .lugar:hover circle,.lugar.sel circle{stroke:#000;stroke-width:3}
  .reg{font-family:"Cormorant Garamond",serif;font-style:italic;fill:var(--tinta2);font-size:20px;opacity:.75}
  .rot{font-family:Inter,sans-serif;font-size:11.5px;font-weight:600;paint-order:stroke;stroke:var(--papel);stroke-width:3.5px}
  .camada{transition:opacity .2s}
  .camada.off{opacity:0;pointer-events:none}
  .painel{background:var(--papel);border-radius:10px;padding:16px 18px;box-shadow:0 6px 24px #0008;max-height:none}
  .painel h2{font-family:"Cormorant Garamond",serif;margin:0 0 6px;font-size:26px}
  .painel h3{font-family:"Cormorant Garamond",serif;margin:12px 0 4px;font-size:19px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;margin:0 4px 8px 0}
  .painel ul{padding-left:18px;margin:6px 0}
  .painel li{margin:4px 0;font-size:14px;line-height:1.4}
  .fase{border-left:4px solid #b3412e;padding:4px 0 4px 10px;margin:8px 0;font-size:14px;line-height:1.4}
  .fase.feita{border-color:#3f7a4a}.fase.prox{border-color:#b07a1e}.fase.depois{border-color:#8a7a5e}
  .leg{margin-top:12px;border-top:1px solid #c9b993;padding-top:10px;font-size:13px}
  .leg div{display:flex;align-items:center;gap:8px;margin:4px 0}
  .dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid #0005;flex:none}
  .ln{width:26px;height:0;border-top:3px solid;display:inline-block;flex:none}
  .nota{color:var(--tinta2);font-size:12px;margin-top:10px;line-height:1.4}
  a.volta{font-size:13px;color:#7a4e9c;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>O que Ferir sabe do mundo</h1>
  <div class="sub">Dia 257, inverno · só o que chegou à casa por estrada, rio, carta ou espião. Toque num lugar para ver o que se sabe dele. Ligue e desligue as camadas para planejar. Distâncias aproximadas.</div>
  <div class="botoes">
    <button class="on" data-c="plano">O Plano do Leve</button>
    <button class="on" data-c="perigo">Perigos que andam</button>
    <button class="on" data-c="casa">Gente da casa na estrada</button>
    <button data-c="painel-plano" id="bt-plano">Ver o plano</button>

  <div class="grid">

        </g>

        <!-- brejo -->

        <g id="c-perigo" class="camada">

          <path d="M530 548 C560 420 620 260 655 165" fill="none" stroke="#b3412e" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#setaC)"/>

    </div>
    <div class="painel" id="painel"></div>
  </div>
</div>

  return `<div class="leg"><b>Legenda</b>
  <div><span class="dot" style="background:${C.casa}"></span>a sua casa (Ireviel)</div>
  <div><span class="dot" style="background:${C.liga}"></span>a Liga</div>
  <div><span class="dot" style="background:${C.cla}"></span>o Clã Hegre</div>
  <div><span class="dot" style="background:${C.livre}"></span>cidade livre</div>
  <div><span class="dot" style="background:${C.neutro}"></span>neutro</div>
  <div><span class="dot" style="background:${C.perigo}"></span>perigo (monstro, mortos, culto, guerra)</div>
  <div><span class="dot" style="background:${C.novo}"></span>terra nova, além do mapa</div>
  <div><span class="ln" style="border-color:#7a4e9c;border-top-style:dashed"></span>tráfego da Liga, cortado na forquilha</div>
  <div><span class="ln" style="border-color:#2b2b2b;border-top-style:dotted"></span>caminho de um perigo</div>
  <div><span class="ln" style="border-color:#b3412e;border-top-style:dotted"></span>gente da casa na estrada</div>
  <div class="nota">Linha azul: o rio Leve. Tracejado claro: a estrada do sal. Quadrados vermelhos: balistas. Tracejado preto na forquilha: a corrente (pronta no 264).</div></div>`;
}
function mostraPlano(){
  if(sel){sel.classList.remove('sel');sel=null;}
  document.getElementById('painel').innerHTML=PLANO+legenda();
}
function mostra(p,el){
  if(sel) sel.classList.remove('sel'); sel=el; el.classList.add('sel');
  const cores={casa:'A sua casa',liga:'A Liga',cla:'O Clã Hegre',livre:'Cidade livre',neutro:'Neutro',perigo:'Perigo',novo:'Terra nova'};
  document.getElementById('painel').innerHTML=
    `<h2>${p.n}</h2>`+
    `<span class="tag" style="background:${C[p.t]}">${cores[p.t]}</span>`+
    p.tags.map(t=>`<span class="tag" style="background:#8a7a5e">${t}</span>`).join('')+
    `<ul>${p.i.map(x=>`<li>${x}</li>`).join('')}</ul>`+
    `<a class="volta" id="volta">voltar ao plano do rio</a>`+legenda();
  document.getElementById('volta').addEventListener('click',mostraPlano);
}
L.forEach(p=>{
  const a=document.createElementNS(NS,'g'); a.setAttribute('class','lugar'+(p.peq?' peq':''));
  const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',p.r);
  c.setAttribute('fill',C[p.t]); c.setAttribute('stroke','#fff8'); c.setAttribute('stroke-width','2');
  const t=document.createElementNS(NS,'text'); t.setAttribute('x',p.x+p.r+4); t.setAttribute('y',p.y+5); t.textContent=p.n;
  if(p.x>820 || p.n==='a Forquilha'){t.setAttribute('x',p.x-p.r-4); t.setAttribute('text-anchor','end');}
  a.appendChild(c); a.appendChild(t);
  a.addEventListener('click',()=>mostra(p,a));
  g.appendChild(a);
});
document.querySelectorAll('.botoes button').forEach(b=>{
  b.addEventListener('click',()=>{
    const c=b.dataset.c;
    if(c==='painel-plano'){mostraPlano();return;}
    b.classList.toggle('on');
    document.getElementById('c-'+c).classList.toggle('off',!b.classList.contains('on'));
  });
});
mostraPlano();
</script>
</body>
</html>
